name: FFXIV Data Downloader

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 0 点执行（北京时间早上 8 点）

jobs:
  download_files:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Check Remote Version
        id: check
        uses: WorkingRobot/ffxiv-downloader@v9.0.0
        with:
          # 用独立目录并跳过 cache，避免改写 exd-data/.cachemeta.json
          output-path: exd-version
          # 使用不匹配任何文件的正则来仅获取版本号，不下载大文件
          regex: "^$"
          use-cache: false

      - name: Retrieve FFXIV Data Cache
        uses: actions/cache@v6
        with:
          path: exd-data
          key: ffxiv-exd-data-${{ steps.check.outputs.version }}
          restore-keys: |
            ffxiv-exd-data-

      - name: Check if already released
        id: release_check
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          echo "Current remote version: $VERSION"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already released. Will skip download."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No release found for version $VERSION."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug release_check output
        run: echo "exists=${{ steps.release_check.outputs.exists }}"

      - name: Download EXD Files
        if: steps.release_check.outputs.exists == 'false'
        id: download
        uses: WorkingRobot/ffxiv-downloader@v9.0.0
        with:
          output-path: exd-data
          # 固定为刚刚检测到的版本，避免与缓存状态冲突
          version: ${{ steps.check.outputs.version }}
          regex: '^sqpack\/ffxiv\/0a0000\..+$'

      - name: Create GitHub Release if updated
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.check.outputs.version }}
          name: 国际服原文件备份 ${{ steps.check.outputs.version }}
          files: exd-data/**
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload Downloaded Artifact
        if: steps.release_check.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ffxiv-exd-files
          path: exd-data
          retention-days: 7
