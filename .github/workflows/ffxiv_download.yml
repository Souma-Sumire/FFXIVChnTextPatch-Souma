name: FFXIV Data Downloader

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

concurrency:
  group: ffxiv-downloader
  cancel-in-progress: true

jobs:
  download_files:
    permissions:
      contents: write

    runs-on: ubuntu-24.04

    steps:
      - name: Check Remote Version
        id: check
        run: |
          python3 - << 'EOF'
          import json, os, time, urllib.request

          query = """
          {
            repository(slug: "4e9a232b") {
              slug
              name
              latestVersion {
                versionString
              }
              versions {
                versionString
                prerequisiteVersions {
                  versionString
                }
                patches {
                  url
                  size
                  versionString
                }
              }
            }
          }
          """
          req = urllib.request.Request(
              "https://thaliak.xiv.dev/graphql/",
              data=json.dumps({"query": query}).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "FFXIVChnTextPatch-Souma/1.0",
              },
          )
          last_err = None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
                  break
              except Exception as e:
                  last_err = e
                  time.sleep(3)
          else:
              raise RuntimeError(f"Thaliak request failed: {last_err}")

          if "errors" in payload:
              raise RuntimeError(f"Thaliak GraphQL error: {payload['errors']}")

          repo = payload["data"]["repository"]
          version = repo["latestVersion"]["versionString"]
          with open("thaliak.json", "w", encoding="utf-8") as f:
              json.dump(repo, f)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
          EOF

      - name: Check if already released
        id: release_check
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          echo "Current remote version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "Error: Failed to obtain remote version."
            exit 1
          fi

          REQUIRED_FILES=("000000.win32.dat0.zip" "000000.win32.index.zip" "000000.win32.index2.zip" "0a0000.win32.dat0.zip" "0a0000.win32.index.zip" "0a0000.win32.index2.zip" "hashes.json")
          ALL_EXISTS=true

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            ASSETS=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets -q ".assets[].name")
            for file in "${REQUIRED_FILES[@]}"; do
              if ! echo "$ASSETS" | grep -qx "$file"; then
                echo "Release $VERSION 缺少关键附件: $file"
                ALL_EXISTS=false
                break
              fi
            done
          else
            ALL_EXISTS=false
          fi

          if [ "$ALL_EXISTS" = "true" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "版本 $VERSION 已完整发布全部数据包附件，跳过下载。"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "版本 $VERSION 尚未发布或附件不完整，将执行下载并更新 Release。"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug release_check output
        run: echo "exists=${{ steps.release_check.outputs.exists }}"

      - name: Prepare local index and CLUT
        if: steps.release_check.outputs.exists == 'false'
        id: prep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ steps.check.outputs.version }}
        run: |
          git clone --depth 1 --branch clut-state "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" clut-state || true
          gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName -q '.[].tagName' > existing_releases.txt || true

          python3 - << 'EOF'
          import collections, datetime, json, os, shutil, subprocess, urllib.error, urllib.request, zipfile

          SLUG = "4e9a232b"
          SCHEMA = "https://raw.githubusercontent.com/WorkingRobot/ffxiv-patches/main/schema/repository.schema.json"
          UPSTREAM_CLUT_BASE = f"https://raw.githubusercontent.com/WorkingRobot/ffxiv-lut/refs/heads/main/cluts/{SLUG}"
          REQUIRED_ZIPS = [
              "000000.win32.dat0.zip", "000000.win32.index.zip", "000000.win32.index2.zip",
              "0a0000.win32.dat0.zip", "0a0000.win32.index.zip", "0a0000.win32.index2.zip",
          ]

          target_version = os.environ["TARGET_VERSION"]
          with open("thaliak.json", "r", encoding="utf-8") as f:
              repo = json.load(f)

          existing_releases = set()
          if os.path.isfile("existing_releases.txt"):
              with open("existing_releases.txt", "r", encoding="utf-8") as f:
                  existing_releases = {line.strip() for line in f if line.strip()}

          versions = {v["versionString"]: v for v in repo["versions"]}
          if target_version not in versions:
              raise RuntimeError(f"Target version {target_version} not found in Thaliak response")

          def pick_patch(v_obj):
              patches = v_obj.get("patches") or []
              if not patches:
                  return None
              for p in patches:
                  name = p["url"].rstrip("/").rsplit("/", 1)[-1]
                  if name.startswith("D"):
                      return p
              return patches[0]

          def has_upstream_clut(ver):
              req = urllib.request.Request(f"{UPSTREAM_CLUT_BASE}/{ver}.clut", method="HEAD")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      return resp.status == 200
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return False
                  raise

          def release_has_all_zips(ver):
              if ver not in existing_releases:
                  return False
              res = subprocess.run(
                  ["gh", "release", "view", ver, "--repo", os.environ["GITHUB_REPOSITORY"], "--json", "assets", "-q", ".assets[].name"],
                  capture_output=True, text=True, check=False,
              )
              if res.returncode != 0:
                  return False
              assets = {line.strip() for line in res.stdout.splitlines() if line.strip()}
              return all(name in assets for name in REQUIRED_ZIPS)

          # 沿 prerequisiteVersions 反向 BFS，优先选择同时具备基准 CLUT 与历史 Release 压缩包的节点以跳过失效的远古补丁
          queue = collections.deque([(target_version, [])])
          visited = {target_version}
          fallback = None
          selected = None

          while queue:
              ver, path_after = queue.popleft()
              local_clut = os.path.join("clut-state", SLUG, f"{ver}.clut")
              source = None
              if os.path.isfile(local_clut):
                  source = ("local", local_clut)
              elif has_upstream_clut(ver):
                  source = ("remote", f"{UPSTREAM_CLUT_BASE}/{ver}.clut")

              if source is not None:
                  has_rel = release_has_all_zips(ver)
                  if has_rel:
                      selected = (ver, source, path_after, True)
                      break
                  if fallback is None:
                      fallback = (ver, source, path_after, False)

              v_obj = versions.get(ver)
              if not v_obj:
                  continue
              for prereq in v_obj.get("prerequisiteVersions") or []:
                  pver = prereq["versionString"]
                  if pver.startswith("H") or pver in visited:
                      continue
                  p_obj = versions.get(pver)
                  if not p_obj or not pick_patch(p_obj):
                      continue
                  visited.add(pver)
                  queue.append((pver, [ver] + path_after))

          chosen = selected or fallback
          if not chosen:
              raise RuntimeError(f"No usable base CLUT found in lineage for {target_version}")

          base_version, base_source, chain_after_base, use_cache = chosen
          print(f"Base CLUT: {base_version} ({base_source[0]}, use_cache={use_cache})")
          print(f"Incremental patches to fold: {chain_after_base}")

          os.makedirs(f"local-cluts/{SLUG}", exist_ok=True)
          os.makedirs("local-index/repos", exist_ok=True)

          if base_source[0] == "local":
              shutil.copyfile(base_source[1], "base.clut")
          else:
              with urllib.request.urlopen(base_source[1], timeout=60) as resp, open("base.clut", "wb") as out:
                  shutil.copyfileobj(resp, out)

          if use_cache:
              shutil.copyfile("base.clut", f"local-cluts/{SLUG}/{base_version}.clut")
              os.makedirs("base-zips", exist_ok=True)
              os.makedirs("exd-data/sqpack/ffxiv", exist_ok=True)
              dl_cmd = ["gh", "release", "download", base_version, "--repo", os.environ["GITHUB_REPOSITORY"], "-D", "base-zips"]
              for zname in REQUIRED_ZIPS:
                  dl_cmd.extend(["-p", zname])
              subprocess.run(dl_cmd, check=True)
              for zname in REQUIRED_ZIPS:
                  raw_name = zname[:-4]
                  with zipfile.ZipFile(os.path.join("base-zips", zname), "r") as zf:
                      with open(os.path.join("exd-data/sqpack/ffxiv", raw_name), "wb") as out:
                          out.write(zf.read(zf.namelist()[0]))
              with open("exd-data/.cachemeta.json", "w", encoding="utf-8") as f:
                  json.dump({"slug": SLUG, "version": base_version, "filtered_files": []}, f)

          now_iso = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          index_versions = chain_after_base if chain_after_base else [target_version]
          patches_map = {}
          prev = None
          for ver in index_versions:
              p = pick_patch(versions[ver])
              if not p:
                  raise RuntimeError(f"No patch URL found for {ver}")
              patches_map[ver] = {
                  "prev": prev,
                  "size": int(p["size"]),
                  "header": None,
                  "sources": {
                      "cdn": {
                          "url": p["url"],
                          "status": "alive",
                          "checked": now_iso,
                      }
                  },
                  "discovered": {
                      "at": now_iso,
                      "method": "thaliak_seed",
                  },
                  "verified": None,
              }
              prev = ver

          repo_doc = {
              "$schema": SCHEMA,
              "slug": SLUG,
              "name": repo["name"],
              "region": "global",
              "latest": target_version,
              "patches": patches_map,
          }
          with open(f"local-index/repos/{SLUG}.json", "w", encoding="utf-8") as f:
              json.dump(repo_doc, f, indent=2)

          need_build = len(chain_after_base) > 0
          if not need_build:
              shutil.copyfile("base.clut", f"local-cluts/{SLUG}/{target_version}.clut")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"need_build={'true' if need_build else 'false'}\n")
              out.write(f"use_cache={'true' if use_cache else 'false'}\n")
          EOF

      - name: Build incremental LUT and CLUT
        if: steps.release_check.outputs.exists == 'false' && steps.prep.outputs.need_build == 'true'
        run: |
          mkdir -p local-luts local-cluts/4e9a232b
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work ghcr.io/workingrobot/ffxiv-downloader:v23.0.0 \
            --index-path local-index lut -s 4e9a232b -o local-luts -c Brotli
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work ghcr.io/workingrobot/ffxiv-downloader:v23.0.0 \
            --index-path local-index clut -s 4e9a232b --base-clut base.clut --base-path local-luts --base-patch-url http://patch-dl.ffxiv.com/game/4e9a232b -o local-cluts/4e9a232b

      - name: Download EXD Files
        if: steps.release_check.outputs.exists == 'false'
        id: download
        run: |
          mkdir -p exd-data
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work ghcr.io/workingrobot/ffxiv-downloader:v23.0.0 \
            --verbose --index-path local-index download -s 4e9a232b -c local-cluts -o exd-data -v "${{ steps.check.outputs.version }}" -f '^sqpack\/ffxiv\/0[0a]0000\.win32\.(dat0|index|index2)$' -p 4 -u "${{ steps.prep.outputs.use_cache }}"
          rm -f exd-data/.cachemeta.json

      - name: Compress backup files and compute hashes
        if: steps.release_check.outputs.exists == 'false'
        run: |
          mkdir -p release-assets
          python3 -c '
          import os, glob, zipfile, hashlib, json

          names = [
              "000000.win32.dat0", "000000.win32.index", "000000.win32.index2",
              "0a0000.win32.dat0", "0a0000.win32.index", "0a0000.win32.index2"
          ]
          hashes = {}
          for name in names:
              matches = glob.glob(f"exd-data/**/{name}", recursive=True)
              if not matches:
                  print(f"Error: {name} not found in exd-data")
                  exit(1)
              src = matches[0]
              with open(src, "rb") as f:
                  data = f.read()
              hashes[name] = hashlib.sha256(data).hexdigest()
              zip_path = os.path.join("release-assets", f"{name}.zip")
              with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  zf.writestr(name, data)
              orig_mb = len(data) / 1024 / 1024
              zip_mb = os.path.getsize(zip_path) / 1024 / 1024
              print(f"Compressed {name}: {orig_mb:.2f} MB -> {zip_mb:.2f} MB")

          with open(os.path.join("release-assets", "hashes.json"), "w", encoding="utf-8") as f:
              json.dump(hashes, f, indent=2)
          '

      - name: Create GitHub Release if updated
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.check.outputs.version }}
          name: 国际服原文件备份 ${{ steps.check.outputs.version }}
          files: |
            release-assets/*.zip
            release-assets/hashes.json
          draft: false
          prerelease: false
          make_latest: false
          generate_release_notes: true

      - name: Upload Downloaded Artifact
        if: steps.release_check.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ffxiv-exd-files
          path: exd-data
          retention-days: 7

      - name: Save CLUT state
        if: steps.release_check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ steps.check.outputs.version }}
        run: |
          mkdir -p clut-push/4e9a232b
          cp "local-cluts/4e9a232b/${TARGET_VERSION}.clut" "clut-push/4e9a232b/${TARGET_VERSION}.clut"
          cd clut-push
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan clut-state
          git add -A
          git commit -m "chore: 更新 CLUT 基准快照 (${TARGET_VERSION})"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" clut-state:refs/heads/clut-state --force
