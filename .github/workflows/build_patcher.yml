name: Build Patcher

on:
  workflow_dispatch:
  push:
    tags:
      - "patcher-v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: patcher/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: patcher/frontend/pnpm-lock.yaml

      - name: Run Go tests
        working-directory: patcher
        run: go test ./... -count=1

      - name: Build Windows executable
        run: pnpm run build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: FFXIVChnTextPatch-SM-v2-windows
          path: FFXIVChnTextPatch-SM-v2.exe
          retention-days: 7

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: patcher/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: patcher/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Run Go tests
        working-directory: patcher
        run: go test ./... -count=1

      - name: Build macOS Universal App Bundle
        run: pnpm run build

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: FFXIVChnTextPatch-SM-v2-macos
          path: FFXIVChnTextPatch-SM-v2-macOS.zip
          retention-days: 7

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/patcher-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Resolve release title
        id: ver
        run: |
          RAW_TAG="${{ github.ref_name }}"
          CLEAN_VER="${RAW_TAG#patcher-}"
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 汉化器 ${{ steps.ver.outputs.version }}
          files: |
            FFXIVChnTextPatch-SM-v2.exe
            FFXIVChnTextPatch-SM-v2-macOS.zip
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
