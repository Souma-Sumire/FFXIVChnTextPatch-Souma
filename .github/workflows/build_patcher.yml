name: Build Patcher

on:
  workflow_dispatch:
  push:
    tags:
      - "patcher-v*"

concurrency:
  group: build-patcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: patcher/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: patcher/frontend/pnpm-lock.yaml

      - name: Run Go tests
        working-directory: patcher
        run: go test -short ./... -count=1

      - name: Build Windows executable
        run: pnpm run build:release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: FFXIVChnTextPatch-SM-v2-windows
          path: FFXIVChnTextPatch-SM-v2.exe
          retention-days: 7

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: patcher/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: patcher/frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Run Go tests
        working-directory: patcher
        run: go test -short ./... -count=1

      - name: Build macOS Universal App Bundle
        run: pnpm run build:release

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: FFXIVChnTextPatch-SM-v2-macos
          path: FFXIVChnTextPatch-SM-v2-macOS.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/patcher-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Resolve release metadata
        id: ver
        run: |
          CLEAN_VER="${GITHUB_REF_NAME#patcher-}"
          TITLE="汉化器 ${CLEAN_VER}"
          PRERELEASE=false
          MAKE_LATEST=true

          # 预览 tag 形如 patcher-v2.2.0-beta.1，后缀须与客户端的预览判定一致。
          # GitHub 不允许把 prerelease 设为 latest，因此显式传 false。
          VER_LOWER="${CLEAN_VER,,}"
          if [[ "${VER_LOWER}" =~ ^v?[0-9.]+-(alpha|beta|rc|preview) ]]; then
            TITLE="${TITLE} 预览版"
            PRERELEASE=true
            MAKE_LATEST=false
          fi

          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Generate hashes.json
        run: |
          WIN_HASH=$(sha256sum FFXIVChnTextPatch-SM-v2.exe | awk '{print $1}')
          MAC_HASH=$(sha256sum FFXIVChnTextPatch-SM-v2-macOS.zip | awk '{print $1}')
          jq -n \
            --arg win "$WIN_HASH" \
            --arg mac "$MAC_HASH" \
            '{"FFXIVChnTextPatch-SM-v2.exe": $win, "FFXIVChnTextPatch-SM-v2-macOS.zip": $mac}' > hashes.json

      - name: Publish release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.ver.outputs.title }}
          files: |
            FFXIVChnTextPatch-SM-v2.exe
            FFXIVChnTextPatch-SM-v2-macOS.zip
            hashes.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.ver.outputs.prerelease }}
          make_latest: ${{ steps.ver.outputs.make_latest }}
          generate_release_notes: true
