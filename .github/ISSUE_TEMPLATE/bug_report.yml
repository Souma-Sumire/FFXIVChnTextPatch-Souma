name: Bug 反馈
description: 汉化问题
title: "[Bug] "
body:
  - type: textarea
    id: description
    attributes:
      label: 问题现象
      description: 出了什么问题，怎么操作出来的。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 调试信息
      description: 点日志栏右上角的「复制调试信息」，粘贴到这里即可。
    validations:
      required: true
